categories:
- name: God
  description: God himself, his being or life, is called eternal or everlasting, lives forever, or is
    'from everlasting to everlasting'.
- name: God’s name, reign, power, divinity, ways, steadfast love, blessedness
  description: An attribute, possession or act of God (name, throne, kingdom, dominion, power, glory,
    love, faithfulness, counsel, purpose, works, praise owed him) is said to endure or be ascribed to
    him forever.
- name: Jesus, the Son
  description: The Messiah, Son or coming ruler, or his throne, kingdom, priesthood or life, is called
    eternal or said to endure forever.
- name: The Spirit
  description: God's Spirit is called eternal or is said to remain with his people forever.
- name: God’s word, law, righteousness, salvation
  description: God's word, testimonies, judgments or righteousness, or the salvation, redemption or gospel
    he gives, is said to stand or last forever.
- name: God’s covenants
  description: A covenant God makes (with Noah, Abraham, Israel, Levi, David, or the new covenant) is
    called everlasting or said to be remembered forever.
- name: Life of believers
  description: Life that God gives is described as eternal or everlasting, or a person is said to live
    forever or never die.
- name: Believers, the righteous
  description: Blessings other than life itself are promised to the righteous or God's people as lasting
    forever, including inheritance, joy, glory, security, name, or dwelling with God.
- name: David’s throne and house
  description: David's line, house, lamp, throne or kingdom is promised to endure forever, whether unconditionally
    or conditionally.
- name: Israel and the land
  description: The nation of Israel is established as God's people forever, or its land is given as an
    everlasting possession.
- name: Zion, Jerusalem, the temple
  description: God's chosen city, mountain or house, or his Name or dwelling there, is said to remain
    forever.
- name: Priesthood, statutes, feasts, offerings
  description: A Mosaic ordinance, priestly office or portion, feast, sign or sacrifice is called a permanent
    or everlasting statute, covenant or portion.
- name: Punishment of the wicked
  description: Judgment on persons, nations, cities or spiritual beings is described as eternal or forever,
    including fire, destruction, shame, contempt, desolation, ruin or torment.
- name: God’s anger?
  description: A verse asks whether, or denies that, God's anger, rejection or forgetting lasts forever,
    or conversely declares that it will burn forever.
- name: Earth, heavens, created order
  description: The earth, heavenly bodies or natural order are said to endure forever or were fixed by
    a lasting decree.
- name: Mountains, hills
  description: Mountains or hills are called everlasting, perpetual or ancient.
- name: Men, human things?
  description: '''Forever'' is applied loosely to merely human matters, including court wishes that a
    king live forever, service or slavery for life, human oaths, memorials, and proverbial sayings.'
