title: Eternal
page: Eternal.md
intro: Places in Scripture where anything is called “eternal”, “everlasting”, or “forever”.
criteria: Include a verse when it calls some person or thing eternal, everlasting, perpetual, or lasting
  forever (or "to all generations", "from everlasting to everlasting"), in any grammatical form, or says
  it will never end. The heading is who or what is said to be eternal. Expressions like "long live the
  king" or hyperbolic court formulas still count, but categorize them for what they are. Words meaning
  "of old" or "ancient" count only when they express eternity (e.g. "the eternal God"), not mere antiquity
  or direction ("east").
